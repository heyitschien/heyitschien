<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Paid client implementation   from client need to reliable handoff</title>
  <desc id="desc">Implementation lifecycle from discovery through requirements, integration, validation, enablement, and handoff.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1600" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F1E8"/>
      <stop offset="1" stop-color="#E8EFE9"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="720" fill="url(#paper)"/>
  <circle cx="1480" cy="80" r="220" fill="#D9E8E1" opacity="0.7"/>
  <circle cx="80" cy="660" r="180" fill="#EBD8C4" opacity="0.5"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="72" y="56" width="430" height="38" rx="19" fill="#DCEBE4" stroke="#85AFA1"/>
    <circle cx="98" cy="75" r="6" fill="#2A695D"/>
    <text x="118" y="81" fill="#2A695D" font-size="16" font-weight="700" letter-spacing="2.5">PAID IMPLEMENTATION  ·  PUBLIC-SAFE</text>

    <text x="72" y="160" fill="#193A37" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">From client need</text>
    <text x="72" y="224" fill="#A86443" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700">to reliable handoff.</text>
    <text x="74" y="278" fill="#536661" font-size="22">Real-estate web presence, lead workflow, validation,</text>
    <text x="74" y="310" fill="#536661" font-size="22">enablement surfaces, and client-owned operations.</text>

    <g transform="translate(72,380)">
      <rect width="1456" height="250" rx="22" fill="#FFFDF8" stroke="#CDBEAD" stroke-width="2"/>
      <!-- steps -->
      <g font-size="15" font-weight="700" fill="#193A37">
        <rect x="36" y="48" width="170" height="88" rx="14" fill="#EAF3EE" stroke="#85AFA1"/>
        <text x="121" y="88" text-anchor="middle">Discover</text>
        <text x="121" y="112" text-anchor="middle" font-size="13" font-weight="400" fill="#536661">real friction</text>

        <rect x="236" y="48" width="170" height="88" rx="14" fill="#F7EFE7" stroke="#CDBEAD"/>
        <text x="321" y="88" text-anchor="middle">Requirements</text>
        <text x="321" y="112" text-anchor="middle" font-size="13" font-weight="400" fill="#536661">tracked work</text>

        <rect x="436" y="48" width="190" height="88" rx="14" fill="#EAF3EE" stroke="#85AFA1"/>
        <text x="531" y="88" text-anchor="middle">Integrate</text>
        <text x="531" y="112" text-anchor="middle" font-size="13" font-weight="400" fill="#536661">site  ·  API  ·  sheets</text>

        <rect x="656" y="48" width="170" height="88" rx="14" fill="#F7EFE7" stroke="#CDBEAD"/>
        <text x="741" y="88" text-anchor="middle">Validate</text>
        <text x="741" y="112" text-anchor="middle" font-size="13" font-weight="400" fill="#536661">expected vs actual</text>

        <rect x="856" y="48" width="170" height="88" rx="14" fill="#EAF3EE" stroke="#85AFA1"/>
        <text x="941" y="88" text-anchor="middle">Enable</text>
        <text x="941" y="112" text-anchor="middle" font-size="13" font-weight="400" fill="#536661">walkthrough</text>

        <rect x="1056" y="48" width="170" height="88" rx="14" fill="#F7EFE7" stroke="#CDBEAD"/>
        <text x="1141" y="88" text-anchor="middle">Handoff</text>
        <text x="1141" y="112" text-anchor="middle" font-size="13" font-weight="400" fill="#536661">clear ownership</text>

        <rect x="1256" y="48" width="160" height="88" rx="14" fill="#193A37"/>
        <text x="1336" y="88" text-anchor="middle" fill="#EAF3EE">Improve</text>
        <text x="1336" y="112" text-anchor="middle" font-size="13" font-weight="400" fill="#D9E8E1">iterate</text>
      </g>

      <text x="36" y="196" fill="#A86443" font-size="15" font-weight="700" letter-spacing="2">OUTCOME</text>
      <text x="36" y="228" fill="#193A37" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700">A client-operable production workflow   not a one-off website dump.</text>
    </g>
  </g>
</svg>
