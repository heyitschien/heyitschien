<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Chrome Extension Tester MCP preview</title>
  <desc id="desc">Open-source MCP and Playwright tooling for AI-assisted browser QA on Chrome extensions.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EEF3F8"/>
      <stop offset="1" stop-color="#E2EBF4"/>
    </linearGradient>
    <linearGradient id="screen" x1="940" y1="185" x2="1430" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E4EDF6"/>
      <stop offset="1" stop-color="#D4E2EF"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#paper)"/>
  <circle cx="1500" cy="90" r="260" fill="#D4E2EF" opacity="0.72"/>
  <circle cx="90" cy="840" r="210" fill="#C8D8E8" opacity="0.55"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="92" y="77" width="480" height="40" rx="20" fill="#DCE8F2" stroke="#6B8FAD"/>
    <circle cx="119" cy="97" r="6" fill="#2A4D6B"/>
    <text x="140" y="104" fill="#2A4D6B" font-size="17" font-weight="700" letter-spacing="3">OPEN SOURCE - AGENT TOOLING</text>
    <text x="92" y="210" fill="#1A3347" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700">Browser evidence,</text>
    <text x="92" y="298" fill="#3A7CA5" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700">for AI agents.</text>
    <text x="96" y="360" fill="#4A5F72" font-size="25">Chrome Extension Tester MCP - launch,</text>
    <text x="96" y="400" fill="#4A5F72" font-size="25">inspect, test, and collect proof.</text>
    <rect x="92" y="460" width="585" height="170" rx="18" fill="#FFFDF8" stroke="#A8BFD4" stroke-width="2"/>
    <text x="126" y="504" fill="#3A7CA5" font-size="16" font-weight="700" letter-spacing="3">TOOLING PRINCIPLE</text>
    <text x="126" y="546" fill="#1A3347" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Agents need observable</text>
    <text x="126" y="580" fill="#1A3347" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">browser evidence.</text>
    <text x="126" y="608" fill="#4A5F72" font-size="16">Expected versus actual behavior must be repeatable.</text>
    <rect x="785" y="78" width="720" height="524" rx="24" fill="#FFFDF8" stroke="#A8BFD4" stroke-width="3"/>
    <rect x="785" y="78" width="720" height="58" rx="24" fill="#1A3347"/>
    <circle cx="823" cy="107" r="7" fill="#C8D8E8"/>
    <circle cx="849" cy="107" r="7" fill="#3A7CA5"/>
    <circle cx="875" cy="107" r="7" fill="#6B8FAD"/>
    <text x="920" y="113" fill="#E8F2FA" font-size="16" font-weight="700" letter-spacing="2">MCP QA WORKSPACE</text>
    <rect x="1294" y="94" width="170" height="30" rx="15" fill="#2A4D6B"/>
    <text x="1322" y="114" fill="#E8F2FA" font-size="13" font-weight="700" letter-spacing="1">PLAYWRIGHT READY</text>
    <rect x="825" y="174" width="410" height="344" rx="16" fill="url(#screen)" stroke="#A8BFD4" stroke-width="2"/>
    <text x="865" y="220" fill="#2A4D6B" font-size="15" font-weight="700" letter-spacing="3">EXTENSION TEST RUN</text>
    <text x="865" y="270" fill="#1A3347" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700">Launch.</text>
    <text x="865" y="318" fill="#1A3347" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700">Inspect. Prove.</text>
    <rect x="865" y="360" width="190" height="44" rx="22" fill="#3A7CA5"/>
    <text x="896" y="388" fill="#FFFDF8" font-size="15" font-weight="700">Collect evidence</text>
    <rect x="865" y="438" width="270" height="12" rx="6" fill="#A8BFD4"/>
    <rect x="865" y="462" width="220" height="12" rx="6" fill="#C8D8E8"/>
    <rect x="1260" y="174" width="200" height="344" rx="16" fill="#1A3347"/>
    <text x="1290" y="220" fill="#A8C8DE" font-size="14" font-weight="700" letter-spacing="2">EVIDENCE</text>
    <circle cx="1310" cy="276" r="14" fill="#6B8FAD"/>
    <text x="1340" y="282" fill="#EEF3F8" font-size="18" font-weight="700">Launched</text>
    <circle cx="1310" cy="340" r="14" fill="#6B8FAD"/>
    <text x="1340" y="346" fill="#EEF3F8" font-size="18" font-weight="700">Inspected</text>
    <circle cx="1310" cy="404" r="14" fill="#C8D8E8"/>
    <text x="1340" y="410" fill="#EEF3F8" font-size="18" font-weight="700">Tested</text>
    <circle cx="1310" cy="468" r="14" fill="#3A7CA5"/>
    <text x="1340" y="474" fill="#EEF3F8" font-size="18" font-weight="700">Logged</text>
    <text x="92" y="682" fill="#1A3347" font-size="18" font-weight="700" letter-spacing="3">THE QA FLOW</text>
    <rect x="92" y="720" width="1413" height="2" fill="#A8BFD4"/>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="220" y="782" fill="#2A4D6B">01 - LAUNCH</text>
      <text x="535" y="782" fill="#2A4D6B">02 - INSPECT</text>
      <text x="850" y="782" fill="#2A4D6B">03 - TEST</text>
      <text x="1265" y="782" fill="#3A7CA5">04 - COLLECT PROOF</text>
    </g>
    <g fill="#4A5F72" font-size="16" text-anchor="middle">
      <text x="220" y="814">extension loaded</text>
      <text x="535" y="814">DOM + state</text>
      <text x="850" y="814">expected vs actual</text>
      <text x="1265" y="814">screenshots + logs</text>
    </g>
    <path d="M350 790H400M665 790H715M1060 790H1130" stroke="#3A7CA5" stroke-width="3" stroke-linecap="round"/>
    <path d="M391 780L405 790L391 800M706 780L720 790L706 800M1121 780L1135 790L1121 800" stroke="#3A7CA5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="866" fill="#4A5F72" font-size="18">Open-source MCP server for AI agents doing browser QA on Chrome extensions.</text>
  </g>
</svg>
