<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Paid client implementation workflow</title>
  <desc id="desc">A public-safe implementation path from discovery through requirements, delivery, validation, and handoff.</desc>
  <rect width="1200" height="675" fill="#f4efe7"/>
  <rect x="55" y="55" width="1090" height="565" rx="28" fill="#fffaf3" stroke="#d8c8b6" stroke-width="4"/>
  <text x="95" y="135" fill="#2f3a3d" font-family="Arial, sans-serif" font-size="38" font-weight="700">Paid client implementation</text>
  <text x="95" y="180" fill="#6b625b" font-family="Arial, sans-serif" font-size="24">Discovery -&gt; delivery -&gt; handoff</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#e6d4c2" stroke="#b99678" stroke-width="3">
      <rect x="95" y="270" width="190" height="115" rx="18"/>
      <rect x="335" y="270" width="190" height="115" rx="18"/>
      <rect x="575" y="270" width="190" height="115" rx="18"/>
      <rect x="815" y="270" width="250" height="115" rx="18"/>
    </g>
    <g fill="#2f3a3d" font-size="25" font-weight="700">
      <text x="190" y="318">Discover</text>
      <text x="430" y="318">Structure</text>
      <text x="670" y="318">Deliver</text>
      <text x="940" y="318">Enable &amp; hand off</text>
    </g>
    <g fill="#6b625b" font-size="19">
      <text x="190" y="352">real needs</text>
      <text x="430" y="352">requirements</text>
      <text x="670" y="352">GitHub + Vercel</text>
      <text x="940" y="352">ownership + next steps</text>
    </g>
  </g>
  <g fill="#8b5e3c" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">
    <text x="310" y="337">-&gt;</text>
    <text x="550" y="337">-&gt;</text>
    <text x="790" y="337">-&gt;</text>
  </g>
  <text x="95" y="505" fill="#2f3a3d" font-family="Arial, sans-serif" font-size="24">Public-safe proof of customer-facing implementation work</text>
  <text x="95" y="548" fill="#6b625b" font-family="Arial, sans-serif" font-size="21">Known dependencies stay visible instead of being presented as complete.</text>
</svg>
