name: Portfolio links

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "assets/**"
      - "scripts/check_portfolio_links.py"
      - ".github/workflows/portfolio-links.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate portfolio evidence paths
        run: python3 scripts/check_portfolio_links.py
